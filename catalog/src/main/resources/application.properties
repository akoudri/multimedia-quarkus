# ===================================
# Catalog Service - Specific Configuration
# ===================================
# Shared properties are inherited from shared-config module
# Only service-specific overrides and unique properties are defined here

# HTTP Configuration - Service-specific port
quarkus.http.port=8081

# Database Configuration - Catalog PostgreSQL
# When running locally with ./gradlew quarkusDev, use localhost
# When running in Docker, use the container name
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/catalog

# Application name
quarkus.application.name=catalog-service

# ===================================
# OpenTelemetry - Distributed Tracing
# ===================================
# Service name appears in Zipkin traces
quarkus.otel.service.name=catalog-service
quarkus.otel.resource.attributes=service.namespace=library,service.version=1.0.0

# Hibernate Second-Level Cache - Entity-specific configuration
quarkus.hibernate-orm.cache."com.akfc.catalog.data.Resource".expiration.max-idle=10M
quarkus.hibernate-orm.cache."com.akfc.catalog.data.Resource".memory.object-count=1000

# ===================================
# Consul Configuration
# ===================================
consul.host=localhost
consul.port=8500

# Disable Consul registration in dev mode (Dev Services handles infrastructure)
%dev.consul.registration.enabled=false
%prod.consul.registration.enabled=true

# ===================================
# Kafka Configuration
# ===================================
# Production Kafka configuration (use 29092 for docker-compose external access)
%prod.kafka.bootstrap.servers=localhost:29092

# Kafka Outgoing Channel - Resource Events (Publish)
mp.messaging.outgoing.resource-events.connector=smallrye-kafka
mp.messaging.outgoing.resource-events.topic=library-resources
mp.messaging.outgoing.resource-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Kafka Incoming Channel - Review Events (Subscribe)
mp.messaging.incoming.review-events.connector=smallrye-kafka
mp.messaging.incoming.review-events.topic=library-reviews
mp.messaging.incoming.review-events.group.id=catalog-service
mp.messaging.incoming.review-events.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
mp.messaging.incoming.review-events.auto.offset.reset=earliest

# ===================================
# SmallRye Stork - Service Discovery
# ===================================
# Stork service discovery for reviews-service via Consul
quarkus.stork.reviews-service.service-discovery.type=consul
quarkus.stork.reviews-service.service-discovery.consul-host=localhost
quarkus.stork.reviews-service.service-discovery.consul-port=8500

# Stork service discovery for users-service via Consul
quarkus.stork.users-service.service-discovery.type=consul
quarkus.stork.users-service.service-discovery.consul-host=localhost
quarkus.stork.users-service.service-discovery.consul-port=8500

# ===================================
# REST Client Configuration
# ===================================
# Use Stork URIs for service-to-service communication
quarkus.rest-client.reviews-service.url=stork://reviews-service
quarkus.rest-client.reviews-service.scope=jakarta.inject.Singleton
quarkus.rest-client.reviews-service.connect-timeout=5000
quarkus.rest-client.reviews-service.read-timeout=10000

quarkus.rest-client.users-service.url=stork://users-service
quarkus.rest-client.users-service.scope=jakarta.inject.Singleton
quarkus.rest-client.users-service.connect-timeout=5000
quarkus.rest-client.users-service.read-timeout=10000

# Google Books API Configuration
quarkus.rest-client."google-books-api".url=https://www.googleapis.com/books/v1
quarkus.rest-client."google-books-api".scope=jakarta.inject.Singleton

# Google Books Sync Configuration
googlebooks.sync.enabled=true
googlebooks.sync.authors=Jules Verne,Victor Hugo,Ali Koudri
googlebooks.sync.max-results-per-author=40

# ===================================
# Dev Services Configuration
# ===================================
# Dev Services are DISABLED due to Docker API version incompatibility (Docker 29+ requires API 1.44+)
# Use docker-compose instead: cd docker && docker-compose up -d

# Disable Dev Services - use docker-compose infrastructure
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.redis.devservices.enabled=false
%dev.quarkus.kafka.devservices.enabled=false

# Dev mode database configuration (docker-compose)
%dev.quarkus.datasource.username=training
%dev.quarkus.datasource.password=training
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/catalog

# Dev mode Redis configuration (docker-compose)
%dev.quarkus.redis.hosts=redis://localhost:6379

# Dev mode Kafka configuration (docker-compose)
%dev.kafka.bootstrap.servers=localhost:29092
