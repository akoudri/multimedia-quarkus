# ===================================
# Shared Configuration for All Services
# ===================================
# This file contains properties shared across all microservices.
# Service-specific properties should remain in individual application.properties files.

# HTTP Configuration - Shared Defaults
quarkus.http.host=0.0.0.0

# Database Configuration - PostgreSQL Defaults
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=training
quarkus.datasource.password=training

# Hibernate Configuration - Development Defaults
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# Consul Configuration - Service Discovery
consul.host=localhost
consul.port=8500
consul.registration.enabled=true

# Redis Configuration - Distributed Caching
# When running locally with ./gradlew quarkusDev, use localhost
# When running in Docker, use the container name
quarkus.redis.hosts=redis://localhost:6379
quarkus.cache.type=redis

# Kafka Configuration - Message Broker
# When running locally with ./gradlew quarkusDev, use localhost:29092
# When running in Docker, use kafka:9092
kafka.bootstrap.servers=localhost:29092

# Disable messaging health checks until publishers/consumers are implemented
mp.messaging.health.enabled=false

# ===================================
# OpenTelemetry Configuration - Distributed Tracing
# ===================================
# Traces are sent to OTel Collector which forwards to Zipkin

# Enable OpenTelemetry
quarkus.otel.enabled=true

# OTLP exporter configuration - pointing to OTel Collector
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc

# Enable traces, disable metrics and logs at OTel level (use Micrometer for metrics)
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false

# Trace sampling - 100% of traces in development
quarkus.otel.traces.sampler=always_on

# Resource attributes - Shared defaults (service.name is set per-service)
quarkus.otel.resource.attributes=deployment.environment=development,version=1.0.0-SNAPSHOT

# Propagate trace context across services (W3C Trace Context + Baggage)
quarkus.otel.propagators=tracecontext,baggage

# ===================================
# Logging Configuration - Trace Correlation
# ===================================
# Log format includes traceId and spanId for correlation with Zipkin traces

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId}, spanId=%X{spanId} [%c{3.}] (%t) %s%e%n

# Log level for OpenTelemetry SDK (reduce noise)
quarkus.log.category."io.opentelemetry".level=INFO
quarkus.log.category."io.quarkus.opentelemetry".level=INFO

# ===================================
# Micrometer Metrics Configuration
# ===================================
# Metrics are exposed at /q/metrics for Prometheus scraping

# Enable Micrometer metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# Enable default binders for JVM, system, and HTTP metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-client.enabled=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.jvm=true

# Add common tags to all metrics
quarkus.micrometer.export.prometheus.default-registry=true
