# HTTP Configuration
quarkus.http.port=8082
quarkus.http.host=0.0.0.0

# Application name
quarkus.application.name=users-service

# ===================================
# Database Configuration
# ===================================
quarkus.datasource.db-kind=postgresql

# Production database configuration
%prod.quarkus.datasource.username=training
%prod.quarkus.datasource.password=training
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:7654/users

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# ===================================
# Redis Configuration
# ===================================
# Production Redis configuration
%prod.quarkus.redis.hosts=redis://localhost:6379

# Cache Configuration
quarkus.cache.type=redis

# Hibernate Second-Level Cache
quarkus.hibernate-orm.cache."com.akfc.users.data.User".expiration.max-idle=10M
quarkus.hibernate-orm.cache."com.akfc.users.data.User".memory.object-count=1000

# ===================================
# Consul Configuration
# ===================================
consul.host=localhost
consul.port=8500

# Disable Consul registration in dev mode (Dev Services handles infrastructure)
%dev.consul.registration.enabled=false
%prod.consul.registration.enabled=true

# ===================================
# Kafka Configuration
# ===================================
# Production Kafka configuration (use 29092 for docker-compose external access)
%prod.kafka.bootstrap.servers=localhost:29092

# Kafka Outgoing Channel - User Events (Publish)
mp.messaging.outgoing.user-events.connector=smallrye-kafka
mp.messaging.outgoing.user-events.topic=library-users
mp.messaging.outgoing.user-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Kafka Incoming Channel - Resource Events (Subscribe)
mp.messaging.incoming.resource-events.connector=smallrye-kafka
mp.messaging.incoming.resource-events.topic=library-resources
mp.messaging.incoming.resource-events.group.id=users-service
mp.messaging.incoming.resource-events.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
mp.messaging.incoming.resource-events.auto.offset.reset=earliest

# ===================================
# Observability Configuration
# ===================================

# OpenTelemetry - Distributed Tracing
quarkus.otel.enabled=true
quarkus.otel.service.name=users-service
%prod.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=false

# Trace sampling (1.0 = 100% of traces)
quarkus.otel.traces.sampler=always_on

# Resource attributes
quarkus.otel.resource.attributes=environment=development,version=1.0.0-SNAPSHOT,tier=backend

# Instrument specific libraries
quarkus.otel.instrument.rest=true
quarkus.otel.instrument.messaging=true
quarkus.otel.instrument.grpc=false

# Propagate trace context
quarkus.otel.propagators=tracecontext,baggage

# Micrometer Prometheus Metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=true
quarkus.micrometer.binder-enabled-default=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Enable specific metric binders
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-client.enabled=true
quarkus.micrometer.binder.mp-metrics.enabled=true

# Logging
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{3.}] (%t) %s%e%n

# ===================================
# Dev Services Configuration
# ===================================
# Dev Services are DISABLED due to Docker API version incompatibility (Docker 29+ requires API 1.44+)
# Use docker-compose instead: cd docker && docker-compose up -d

# Disable Dev Services - use docker-compose infrastructure
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.redis.devservices.enabled=false
%dev.quarkus.kafka.devservices.enabled=false

# Dev mode database configuration (docker-compose)
%dev.quarkus.datasource.username=training
%dev.quarkus.datasource.password=training
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:7654/users

# Dev mode Redis configuration (docker-compose)
%dev.quarkus.redis.hosts=redis://localhost:6379

# Dev mode Kafka configuration (docker-compose)
%dev.kafka.bootstrap.servers=localhost:29092
