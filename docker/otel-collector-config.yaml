# OpenTelemetry Collector Configuration
# Receives traces from microservices via OTLP and forwards to Zipkin

receivers:
  # OTLP receiver for gRPC and HTTP
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch processor for better performance
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource processor to add common attributes
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  # Zipkin exporter
  zipkin:
    endpoint: "http://zipkin:9411/api/v2/spans"
    format: proto

  # Debug exporter (logs traces to console for debugging)
  debug:
    verbosity: basic

  # Prometheus exporter for collector metrics
  prometheus:
    endpoint: "0.0.0.0:8889"

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance profiler
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]

  pipelines:
    # Traces pipeline: OTLP -> processing -> Zipkin
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [zipkin, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
