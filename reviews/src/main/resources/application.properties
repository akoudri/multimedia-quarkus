# ===================================
# Reviews Service - Specific Configuration
# ===================================
# Shared properties are inherited from shared-config module
# Only service-specific overrides and unique properties are defined here

# HTTP Configuration - Service-specific port
quarkus.http.port=8083

# Database Configuration - Reviews PostgreSQL
# When running locally with ./gradlew quarkusDev, use localhost
# When running in Docker, use the container name
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:6543/reviews

# Application name
quarkus.application.name=reviews-service

# OpenTelemetry - Service-specific name
quarkus.otel.service.name=reviews-service

# Hibernate Second-Level Cache - Entity-specific configuration
quarkus.hibernate-orm.cache."com.akfc.reviews.data.Review".expiration.max-idle=10M
quarkus.hibernate-orm.cache."com.akfc.reviews.data.Review".memory.object-count=1000

# ===================================
# Consul Configuration
# ===================================
consul.host=localhost
consul.port=8500

# Disable Consul registration in dev mode (Dev Services handles infrastructure)
%dev.consul.registration.enabled=false
%prod.consul.registration.enabled=true

# ===================================
# Kafka Configuration
# ===================================
# Production Kafka configuration (use 29092 for docker-compose external access)
%prod.kafka.bootstrap.servers=localhost:29092

# Kafka Outgoing Channel - Review Events (Publish)
mp.messaging.outgoing.review-events.connector=smallrye-kafka
mp.messaging.outgoing.review-events.topic=library-reviews
mp.messaging.outgoing.review-events.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Kafka Incoming Channel - Resource Events (Subscribe)
mp.messaging.incoming.resource-events.connector=smallrye-kafka
mp.messaging.incoming.resource-events.topic=library-resources
mp.messaging.incoming.resource-events.group.id=reviews-service
mp.messaging.incoming.resource-events.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
mp.messaging.incoming.resource-events.auto.offset.reset=earliest

# Kafka Incoming Channel - User Events (Subscribe)
mp.messaging.incoming.user-events.connector=smallrye-kafka
mp.messaging.incoming.user-events.topic=library-users
mp.messaging.incoming.user-events.group.id=reviews-service
mp.messaging.incoming.user-events.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
mp.messaging.incoming.user-events.auto.offset.reset=earliest

# ===================================
# Dev Services Configuration
# ===================================
# Dev Services are DISABLED due to Docker API version incompatibility (Docker 29+ requires API 1.44+)
# Use docker-compose instead: cd docker && docker-compose up -d

# Disable Dev Services - use docker-compose infrastructure
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.redis.devservices.enabled=false
%dev.quarkus.kafka.devservices.enabled=false

# Dev mode database configuration (docker-compose)
%dev.quarkus.datasource.username=training
%dev.quarkus.datasource.password=training
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:6543/reviews

# Dev mode Redis configuration (docker-compose)
%dev.quarkus.redis.hosts=redis://localhost:6379

# Dev mode Kafka configuration (docker-compose)
%dev.kafka.bootstrap.servers=localhost:29092
